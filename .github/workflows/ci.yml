name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Workflow files contain no secrets
        run: |
          if grep -rniE '"(password|secret|token|apiKey)"\s*:\s*"[^"{=$]' n8n/workflows; then
            echo "A literal secret value was found in the exported workflows." && exit 1
          fi
