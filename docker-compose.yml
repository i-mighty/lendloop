services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    # Secrets come from .env.n8n (generated by scripts/setup-local.sh, gitignored).
    env_file: .env.n8n
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      # Workflows read the HMAC secrets and the Convex URL with $env in expressions and Code nodes.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Code nodes may load Node's crypto module, and nothing else.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Local HTTP only. Remove behind HTTPS in production.
      N8N_SECURE_COOKIE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    entrypoint: ["tini", "--", "/bin/sh", "/opt/lendloop/init.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/opt/lendloop:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mailpit

  # Catches every email n8n sends. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  n8n_data:
